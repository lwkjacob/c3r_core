<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>lwk_control</title>
    <style>
        :root {
            --panel: rgba(16, 19, 24, .96); --line: rgba(255, 255, 255, .1);
            --text: #e8ebf0; --muted: #8b94a3; --accent: #f0b040;
        }
        html, body { margin: 0; background: transparent; overflow: hidden; pointer-events: none;
                     font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; color: var(--text); }

        #hud {
            position: fixed; right: 2%; bottom: 4.5%;
            width: 14px; height: 14px; border-radius: 50%;
            background: #666; box-shadow: 0 0 0 3px rgba(0, 0, 0, .55);
            transition: background .15s, box-shadow .15s;
        }
        #hud.state-loading    { background: #5b94f5; animation: pulse 1s infinite; }
        #hud.state-idle       { background: #666; }
        #hud.state-opening    { background: var(--accent); opacity: .5; }
        #hud.state-listening  { background: var(--accent); box-shadow: 0 0 0 3px rgba(240, 176, 64, .45); }
        #hud.state-processing { background: #5b94f5; }
        #hud.state-error      { background: #e85555; }
        @keyframes pulse { 50% { opacity: .35; } }

        #settings { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
                    background: rgba(0, 0, 0, .35); pointer-events: auto; }
        #settings.open { display: flex; }
        .panel { width: 380px; max-height: 92vh; overflow-y: auto; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
                 padding: 20px 22px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
        .panel h1 { margin: 0 0 16px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
        .panel h1 span { color: var(--accent); }
        .row { margin-bottom: 14px; }
        .row label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
        select, input[type=range], input[type=text] { width: 100%; box-sizing: border-box; }
        select, input[type=text] { background: #0b0d11; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px; font: inherit; }
        input[type=text] { text-transform: uppercase; }
        input[type=range] { accent-color: var(--accent); }
        .check, .row label.check { display: flex; justify-content: flex-start; gap: 8px; align-items: center;
                                   color: var(--text); font-size: 13px; }
        .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
        button { border: 1px solid var(--line); background: #1f242c; color: var(--text); border-radius: 6px;
                 padding: 7px 14px; cursor: pointer; font: inherit; }
        button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
        button.ghost { margin-right: auto; }
        .meter { height: 8px; margin: 8px 0; background: #0b0d11; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
        #mic-level { height: 100%; width: 0; background: var(--accent); transition: width .05s; }
        #mic-level.clip { background: #e85555; }
        .muted { color: var(--muted); font-size: 12px; }
        #mic-test { width: 100%; user-select: none; }
        #mic-test.held { background: var(--accent); color: #111; }
        #learned { max-height: 120px; overflow-y: auto; }
        .fix { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 3px 0;
               border-bottom: 1px solid var(--line); }
        .fix button { padding: 0 8px; line-height: 20px; }
    </style>
</head>
<body>
    <div id="hud" class="state-loading"></div>

    <div id="settings" role="dialog" aria-label="lwk_control settings">
        <div class="panel">
            <h1><span>lwk</span>_control</h1>
            <div class="row">
                <label for="set-mic">Microphone</label>
                <select id="set-mic"></select>
                <label class="check" style="margin-top:8px"><input id="set-micfx" type="checkbox"> Mic noise filtering</label>
            </div>
            <div class="row">
                <label>Mic check <span id="mic-hint"></span></label>
                <button id="mic-test">Hold and say a command</button>
                <div class="meter"><div id="mic-level"></div></div>
                <div id="mic-heard" class="muted">Shows what dispatch hears and which command it matches.</div>
            </div>
            <div class="row">
                <label>Learned corrections <span>from your say-agains</span></label>
                <div id="learned"></div>
            </div>
            <div class="row">
                <label for="set-callsign">Callsign <span id="set-callsign-hint"></span></label>
                <input id="set-callsign" type="text" maxlength="20" placeholder="e.g. 1-Adam-12" autocomplete="off">
                <label class="check" style="margin-top:8px"><input id="set-callsign-on" type="checkbox"> Dispatcher says my callsign</label>
            </div>
            <div class="row">
                <label for="set-anim">Radio animation</label>
                <select id="set-anim"></select>
            </div>
            <div class="row">
                <label for="set-voice">Dispatcher volume <b id="set-voice-val"></b></label>
                <input id="set-voice" type="range" min="0" max="100">
            </div>
            <div class="row">
                <label for="set-clicks">Radio click volume <b id="set-clicks-val"></b></label>
                <input id="set-clicks" type="range" min="0" max="100">
            </div>
            <label class="check"><input id="set-clicks-on" type="checkbox"> Play radio clicks</label>
            <div class="buttons">
                <button id="set-test" class="ghost">Test voice</button>
                <button id="set-cancel">Cancel</button>
                <button id="set-save" class="primary">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Large static files (speech model, voice clips) come from the lwk_control_assets resource.
        var ASSETS = 'https://cfx-nui-lwk_control_assets/';
        // sherpa-onnx (Emscripten) runtime: the model is in its .data package.
        var Module = { locateFile: function (path) { return ASSETS + 'nui/sherpa/' + path; }, setStatus: function () {} };
        window.sherpaReady = new Promise(function (resolve) { Module.onRuntimeInitialized = resolve; });
    </script>
    <script src="https://cfx-nui-lwk_control_assets/nui/sherpa/sherpa-onnx-asr.js"></script>
    <script src="https://cfx-nui-lwk_control_assets/nui/sherpa/sherpa-onnx-wasm-main-asr.js"></script>
    <script src="ears.js"></script>
    <script src="voice.js"></script>
    <script src="settings.js"></script>
</body>
</html>
