<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lwk_k9</title>
<style>
    /* lwk_k9 — the dog's options, BY LWK DEVELOPMENT */
    :root { --glass: rgba(14, 18, 26, .82); --line: rgba(255, 255, 255, .14); --text: #fff; --dim: rgba(255, 255, 255, .6); --accent: #7fb2ff; }
    html, body { margin: 0; height: 100%; background: transparent; font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; color: var(--text); overflow: hidden; }
    #panel { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); width: 320px; padding: 18px 18px 14px;
             background: var(--glass); border: 1px solid var(--line); border-top-color: rgba(255, 255, 255, .3); border-radius: 14px;
             box-shadow: 0 18px 50px rgba(0, 0, 0, .45); display: none; }
    #panel.open { display: block; }
    h1 { margin: 0 0 2px; font-size: 17px; font-weight: 650; }
    .by { margin: 0 0 14px; font-size: 10.5px; letter-spacing: .14em; color: var(--dim); }
    label { display: block; margin: 12px 0 5px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
    select, input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
                    background: rgba(255, 255, 255, .06); color: var(--text); font: inherit; }
    select option { background: #141922; }
    select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .part { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; margin-top: 8px; }
    .step { display: flex; align-items: center; gap: 4px; }
    .step span { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12.5px; }
    button { border: 1px solid var(--line); background: rgba(255, 255, 255, .08); color: var(--text); border-radius: 7px; font: inherit; cursor: pointer; }
    .step button { width: 26px; height: 26px; padding: 0; }
    button:hover { background: rgba(255, 255, 255, .16); }
    button:disabled { opacity: .35; cursor: default; }
    #done { width: 100%; margin-top: 16px; padding: 9px; font-weight: 600; border-color: var(--accent); }
    .none { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
</style>
</head>
<body>
<div id="panel" role="dialog" aria-labelledby="k9-title">
    <h1 id="k9-title">Your dog</h1>
    <p class="by">BY LWK DEVELOPMENT</p>
    <label for="breed">Breed</label>
    <select id="breed"></select>
    <label for="name">Name</label>
    <input id="name" maxlength="20" placeholder="Name your dog" autocomplete="off">
    <label>Look</label>
    <div id="parts"></div>
    <button id="done" type="button">Done</button>
</div>
<script>
    const $ = (id) => document.getElementById(id);
    const post = (cb, data) => fetch(`https://${GetParentResourceName()}/${cb}`, { method: 'POST', body: JSON.stringify(data || {}) }).catch(() => {});
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let parts = [];

    function show(d) {
        $('breed').innerHTML = d.breeds.map((b) => `<option value="${esc(b.model)}"${b.model === d.model ? ' selected' : ''}>${esc(b.label)}${b.police ? ' (police)' : ''}</option>`).join('');
        if (document.activeElement !== $('name')) $('name').value = d.name || '';
        parts = d.parts || [];
        $('parts').innerHTML = parts.length ? parts.map((p, i) => `
            <div class="part">
                <span>Part ${p.c}</span>
                <div class="step" aria-label="Style"><button type="button" data-i="${i}" data-k="d" data-s="-1" ${p.n < 2 ? 'disabled' : ''} aria-label="Previous style">‹</button><span>Style ${p.d + 1}/${p.n}</span><button type="button" data-i="${i}" data-k="d" data-s="1" ${p.n < 2 ? 'disabled' : ''} aria-label="Next style">›</button></div>
                <div class="step" aria-label="Colour"><button type="button" data-i="${i}" data-k="t" data-s="-1" ${p.tn < 2 ? 'disabled' : ''} aria-label="Previous colour">‹</button><span>Colour ${p.t + 1}/${Math.max(p.tn, 1)}</span><button type="button" data-i="${i}" data-k="t" data-s="1" ${p.tn < 2 ? 'disabled' : ''} aria-label="Next colour">›</button></div>
            </div>`).join('') : '<div class="none">This breed has only the one look.</div>';
    }

    $('parts').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-i]');
        if (!b) return;
        const p = parts[Number(b.dataset.i)], s = Number(b.dataset.s);
        let d = p.d, t = p.t;
        if (b.dataset.k === 'd') { d = (d + s + p.n) % p.n; t = 0; } else { t = (t + s + p.tn) % p.tn; }
        post('part', { c: p.c, d, t });
    });
    $('breed').addEventListener('change', (e) => post('breed', { model: e.target.value }));
    $('name').addEventListener('change', (e) => post('name', { name: e.target.value }));
    $('done').addEventListener('click', () => { post('name', { name: $('name').value }); post('close'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('panel').classList.contains('open')) { post('name', { name: $('name').value }); post('close'); } });

    window.addEventListener('message', (e) => {
        const d = e.data;
        if (!d || d.type !== 'k9') return;
        $('panel').classList.toggle('open', !!d.open);
        if (d.open) show(d);
    });
</script>
</body>
</html>
